<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>駐車場所メモ</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;margin:0;padding:16px;background:#f5f7f8;color:#1d252b}main{max-width:520px;margin:0 auto}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}h1{font-size:22px;margin:0}h2{font-size:18px;margin:0 0 12px}section{background:white;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px #0000000d}.muted{color:#65727a;font-size:13px}.date-chip{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:7px 11px;white-space:nowrap;background:#e3f4e9;color:#176b3a}.date-chip.past{background:#fff0d8;color:#875400}.field{margin:16px 0}.field-label{display:block;font-weight:700;margin-bottom:9px}.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}button,input{font:inherit}.choice{border:1px solid #cbd3d8;background:#fff;color:#263238;border-radius:10px;min-height:44px;padding:9px 5px;font-weight:600}.choice.selected{background:#e4f2eb;border:2px solid #176b50;padding:8px 4px}.area-layout{display:flex;flex-direction:column;gap:8px}.area-middle{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.area-single{display:flex;justify-content:center}.area-single .choice{width:33.333%;max-width:160px}.memo{width:100%;box-sizing:border-box;border:1px solid #cbd3d8;border-radius:10px;padding:11px;min-height:44px}.save{width:100%;border:0;border-radius:10px;background:#176b50;color:white;font-weight:700;padding:13px;margin-top:4px}.record{border-top:1px solid #e6eaec;padding:12px 0}.record:first-child{border-top:0;padding-top:0}.record-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.record-place{font-size:17px;font-weight:700}.record-date{font-size:12px;color:#5b6870;white-space:nowrap}.record-date.today{color:#176b3a;font-weight:700}.record-date.past{color:#875400;font-weight:700}.record-memo{margin-top:5px;white-space:pre-wrap;overflow-wrap:anywhere}.latest-place{font-size:20px;font-weight:700;margin:8px 0}.empty{color:#65727a;font-size:14px}@media(max-width:360px){body{padding:10px}.choices{gap:6px}.choice{font-size:14px}}
</style>
</head>
<body><main>
<div class="heading"><h1>駐車場所メモ</h1><span id="todayDate" class="muted"></span></div>
<section><h2>前回、駐車した場所</h2><div id="latest"><p class="empty">まだ記録がありません。</p></div></section>
<section><h2>駐車した場所を記録</h2>
<div class="field"><span class="field-label">階</span><div class="choices">
<button type="button" class="choice selected" data-floor="1階">1階</button><button type="button" class="choice" data-floor="2階">2階</button><button type="button" class="choice" data-floor="3階">3階</button><button type="button" class="choice" data-floor="屋上">屋上</button>
</div></div>
<div class="field"><span class="field-label">エリア</span><div class="area-layout">
<div class="area-single"><button type="button" class="choice" data-area="北">北</button></div>
<div class="area-middle"><button type="button" class="choice" data-area="西">西</button><button type="button" class="choice selected" data-area="中">中</button><button type="button" class="choice" data-area="東">東</button></div>
<div class="area-single"><button type="button" class="choice" data-area="南">南</button></div>
</div></div>
<div class="field"><label class="field-label" for="memo">メモ（任意）</label><input id="memo" class="memo" type="text" placeholder="例：エレベーターの近く"></div>
<button id="save" class="save" type="button">保存する</button><p class="muted">保存日時は自動で記録され、次に開いたときも「今日／過去」が表示されます。</p>
</section><section><h2>保存履歴</h2><div id="history"></div></section>
</main>
<script>
(() => {
const KEY='parkingMemoRecordsV3';let selectedFloor='1階',selectedArea='中';
const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayKey=()=>dateKey(new Date());
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const read=()=>{try{const r=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(r)?r:[]}catch{return[]}};
const recKey=r=>{if(r.dateKey)return r.dateKey;const d=new Date(r.time);return Number.isNaN(d.getTime())?'':dateKey(d)};
const dateTime=r=>{const d=new Date(r.time);if(Number.isNaN(d.getTime()))return'日時不明';return`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
const place=r=>`${r.floor||''}・${r.area||''}`;
function render(){
const records=read().sort((a,b)=>new Date(b.time).getTime()-new Date(a.time).getTime()),today=todayKey();
document.getElementById('todayDate').textContent=`今日：${today.replaceAll('-','/')}`;
const latest=document.getElementById('latest');
if(!records.length)latest.innerHTML='<p class="empty">まだ記録がありません。</p>';
else{const r=records[0],isToday=recKey(r)===today;latest.innerHTML=`<div class="record-top"><span class="date-chip ${isToday?'':'past'}">${isToday?'今日の記録':'過去の記録'}</span><span class="record-date">${esc(dateTime(r))}</span></div><div class="latest-place">${esc(place(r))}</div>${r.memo?`<div class="record-memo">${esc(r.memo)}</div>`:''}`}
const history=document.getElementById('history');if(!records.length){history.innerHTML='<p class="empty">保存した記録はここに表示されます。</p>';return}
history.innerHTML=records.map(r=>{const isToday=recKey(r)===today;return`<div class="record"><div class="record-top"><span class="record-place">${esc(place(r))}</span><span class="date-chip ${isToday?'':'past'}">${isToday?'今日':'過去'}</span></div><div class="record-date ${isToday?'today':'past'}">${esc(dateTime(r))}</div>${r.memo?`<div class="record-memo">${esc(r.memo)}</div>`:''}</div>`}).join('');
}
document.querySelectorAll('[data-floor]').forEach(btn=>btn.addEventListener('click',()=>{selectedFloor=btn.dataset.floor;document.querySelectorAll('[data-floor]').forEach(b=>b.classList.toggle('selected',b===btn))}));
document.querySelectorAll('[data-area]').forEach(btn=>btn.addEventListener('click',()=>{selectedArea=btn.dataset.area;document.querySelectorAll('[data-area]').forEach(b=>b.classList.toggle('selected',b===btn))}));
document.getElementById('save').addEventListener('click',()=>{const now=new Date(),records=read();records.push({floor:selectedFloor,area:selectedArea,memo:document.getElementById('memo').value.trim(),time:now.toISOString(),dateKey:todayKey()});localStorage.setItem(KEY,JSON.stringify(records));document.getElementById('memo').value='';render()});
render();
})();
</script></body></html>
